<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dead Reckoning</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23070D12'/><g fill='none' stroke='%2393CBE2' stroke-width='2.6' stroke-linecap='square'><circle cx='16' cy='19' r='9'/><path d='M12 4h8M16 4v3M16 19l5-4'/></g></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700&family=Silkscreen&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* ONE COLOUR / FOUR LEVELS
   INVERT : solid fill + dark text  -> active tab, overdue, imminent
   L1 100%: primary data
   L2 58% : labels, secondary
   L3 24% : rules and dividers only                              */
:root{
  --nc:150px;
  --p:#93CBE2;
  --l2:rgba(147,203,226,.58);
  --l3:rgba(147,203,226,.24);
  --l4:rgba(147,203,226,.09);
  --bg:#070D12;
  --ink:#070D12;
  --px:"Silkscreen",monospace;
  --nu:"Oxanium",ui-monospace,monospace;
  --mo:"Share Tech Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;border-radius:0!important}
html{color-scheme:dark;-webkit-text-size-adjust:100%}
body{margin:0;padding:0 0 64px;background:var(--bg);color:var(--p);
  font-family:var(--mo);font-size:16px;line-height:1.45}
.w{max-width:980px;margin:0 auto;padding:0 16px}
::selection{background:var(--p);color:var(--ink)}
button{font-family:var(--mo);color:inherit;background:none;border:0;cursor:pointer;font-size:inherit}
a{color:var(--p);word-break:break-all}

/* ── banner ── */
.frame{position:relative;border:1px solid var(--l3);padding:5px;margin:18px 0 6px}
.frame img{display:block;width:100%;height:clamp(300px,44vw,430px);object-fit:contain;object-position:50% 50%}
.frame .tk{position:absolute;width:9px;height:9px;border:0 solid var(--p)}
.tk.a{top:-1px;left:-1px;border-top-width:1px;border-left-width:1px}
.tk.b{top:-1px;right:-1px;border-top-width:1px;border-right-width:1px}
.tk.c{bottom:-1px;left:-1px;border-bottom-width:1px;border-left-width:1px}
.tk.d{bottom:-1px;right:-1px;border-bottom-width:1px;border-right-width:1px}
.fmeta{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  font-family:var(--nu);font-weight:500;font-size:13px;letter-spacing:.1em;color:var(--l2);margin-bottom:26px}
.fmeta b{color:var(--p);font-weight:400}

/* ── status ── */
.status{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding:8px 0;border-bottom:1px solid var(--l3);font-size:13px;color:var(--l2)}
.status b{font-family:var(--nu);font-weight:700;font-size:16px;color:var(--p);
  font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* ── masthead ── */
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:24px 0 16px;flex-wrap:wrap}
.ttl{font-family:var(--px);font-size:10px;letter-spacing:.16em;color:var(--l2);line-height:2}
.ttl u{display:block;text-decoration:none;color:var(--p);font-size:16px;letter-spacing:.1em}
.cnt{display:flex;align-items:flex-end;gap:26px}
.cnt .num{font-family:var(--nu);font-weight:700;font-size:clamp(46px,11vw,72px);line-height:.8;
  letter-spacing:-.02em;color:var(--p);font-variant-numeric:tabular-nums}
.cnt .sm{font-family:var(--nu);font-weight:500;font-size:26px;color:var(--l2);line-height:.9;
  letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.cnt .u{font-family:var(--px);font-size:8px;letter-spacing:.12em;color:var(--l2);margin-top:8px}

.pbar{position:relative;height:8px;border-top:1px solid var(--l3);border-bottom:1px solid var(--l3)}
.pbar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--l3)}
.pbar .cur{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--p)}
.pbar .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--l3)}
.plab{display:flex;justify-content:space-between;font-family:var(--px);font-size:8px;
  letter-spacing:.1em;color:var(--l2);margin-top:6px;margin-bottom:30px}

/* ── tabs ── */
[role=tablist]{display:flex;gap:26px;border-bottom:1px solid var(--l3);margin-bottom:26px}
[role=tab]{padding:0 0 9px;font-family:var(--px);font-size:11px;letter-spacing:.12em;
  color:var(--l2);border-bottom:2px solid transparent;margin-bottom:-1px}
[role=tab]:hover{color:var(--p)}
[role=tab][data-selected]{color:var(--p);border-bottom-color:var(--p)}
[role=tab]:focus-visible{outline:1px solid var(--p);outline-offset:3px}
[role=tabpanel]:focus{outline:none}

/* ── section headings, no boxes ── */
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  border-bottom:1px solid var(--l3);padding-bottom:6px;margin:0 0 14px}
.sh h2{font-family:var(--px);font-size:10px;letter-spacing:.14em;color:var(--p);margin:0;font-weight:400}
.sh span{font-size:12.5px;color:var(--l2)}
.grp{margin-bottom:36px}

/* ── timeline ── */
.map{overflow-x:auto}
.mapin{min-width:620px}
.mhead{display:grid;grid-template-columns:136px 1fr;gap:14px;margin-bottom:8px}
.wks{display:grid;grid-template-columns:repeat(7,1fr);font-family:var(--px);font-size:8px;
  letter-spacing:.06em;color:var(--l2)}
.wks span{text-align:center}
.wks span.on{color:var(--p)}
.mrow{display:grid;grid-template-columns:136px 1fr;gap:14px;align-items:center;padding:3px 0;
  position:relative;z-index:1}
.mrow .nm{font-size:13px;color:var(--l2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-transform:uppercase;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mrow .nm i{font-style:normal;font-family:var(--nu);font-weight:500;font-size:11.5px;color:var(--l3);
  flex-shrink:0;font-variant-numeric:tabular-nums}
.mrow .nm.all{text-decoration:line-through;color:var(--l3)}
.mrow .nm.all i{color:var(--p);text-decoration:none;display:inline-block}
.rows{position:relative}
.ov{position:absolute;top:0;bottom:0;left:0;right:0;pointer-events:none;z-index:0}
.ov .wk{position:absolute;top:0;bottom:0;width:1px;background:var(--l4);
  left:calc(var(--nc) + (100% - var(--nc)) * var(--x))}
.nowl{position:absolute;top:-8px;bottom:-4px;width:1px;background:var(--p);z-index:3;pointer-events:none;
  box-shadow:0 0 7px rgba(147,203,226,.55);left:calc(var(--nc) + (100% - var(--nc)) * var(--x))}
.nowl::before{content:"";position:absolute;top:-3px;left:-2px;width:5px;height:5px;background:var(--p)}
.lane{position:relative;height:14px}
.bar{position:absolute;top:0;height:14px;border:1px solid var(--p);background:rgba(147,203,226,.15)}
.bar.s{background:none}
.bar b{display:block;height:100%;background:var(--p)}

/* ── strands ── */
.st{border-bottom:1px solid var(--l4)}
.sbtn{display:flex;align-items:center;gap:12px;padding:11px 2px;width:100%;text-align:left}
.sbtn:hover .t{color:#fff}
.sbtn:focus-visible{outline:1px solid var(--p);outline-offset:-2px}
.sbtn .k{font-family:var(--px);font-size:8px;color:var(--l2);width:9px;flex-shrink:0}
.sbtn[aria-expanded=true] .k{color:var(--p)}
.sbtn .t{flex:1;font-size:17px;text-transform:uppercase;color:var(--p)}
.sbtn[data-all] .t{color:var(--l2);text-decoration:line-through}
.sbtn .n{font-size:13px;color:var(--l2)}
.sbtn .mini{width:54px;height:5px;background:var(--l3);flex-shrink:0}
.sbtn .mini b{display:block;height:100%;background:var(--p)}
.sb{display:none;padding:2px 2px 20px 21px}
.sb[data-open]{display:block}

.task{display:flex;align-items:center;gap:11px;padding:6px 0;border-bottom:1px solid var(--l4)}
.cb{width:14px;height:14px;flex-shrink:0;border:1px solid var(--l2);display:flex;align-items:center;
  justify-content:center;font-family:var(--px);font-size:8px;color:var(--ink);line-height:1}
.cb:hover{border-color:var(--p)}
.task[data-done] .cb{background:var(--p);border-color:var(--p)}
.tx{flex:1;font-size:16px;min-width:0;padding:2px 4px;margin-left:-4px;cursor:text}
.tx:hover{background:var(--l4)}
.tx:focus{outline:none;background:var(--l4);box-shadow:inset 0 -1px 0 var(--p)}
.task[data-done] .tx{color:var(--l2);text-decoration:line-through}
input[type=date]{background:none;border:1px solid transparent;color:var(--l2);font-family:var(--mo);
  font-size:13px;padding:2px 3px;width:106px;flex-shrink:0}
input[type=date]:hover{border-color:var(--l3)}
input[type=date]:focus{outline:none;border-color:var(--p);color:var(--p)}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(83%) sepia(23%) saturate(560%) hue-rotate(165deg);opacity:.5}
.task[data-late] input[type=date]{background:var(--p);color:var(--ink);border-color:var(--p)}
.task[data-done] input[type=date]{opacity:.35;background:none;color:var(--l2)}
.rm{color:var(--l3);font-size:13px;padding:2px 4px;flex-shrink:0;opacity:0}
.task:hover .rm,.rm:focus{opacity:1}
.rm:hover{color:var(--p)}

.add{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
input[type=text],select,textarea{background:none;border:1px solid var(--l3);color:var(--p);
  font-family:var(--mo);font-size:15px;padding:6px 9px}
input[type=text]{flex:1;min-width:150px}
input[type=text]:focus,select:focus,textarea:focus{outline:none;border-color:var(--p)}
input[type=text]::placeholder,textarea::placeholder{color:var(--l3)}
select{cursor:pointer;font-size:13px}
select option{background:var(--bg)}
textarea{width:100%;margin-top:14px;resize:vertical;min-height:44px;color:var(--l2)}
.btn{border:1px solid var(--l2);padding:6px 14px;font-family:var(--px);font-size:9px;letter-spacing:.1em;color:var(--l2)}
.btn:hover{background:var(--p);color:var(--ink);border-color:var(--p)}
.btn:focus-visible{outline:1px solid var(--p);outline-offset:2px}
.ops{display:flex;gap:20px;margin-top:15px;flex-wrap:wrap}
.lk{font-family:var(--px);font-size:9px;letter-spacing:.08em;color:var(--l3)}
.lk:hover{color:var(--p)}

/* ── college ── */
.ct{width:100%;border-collapse:collapse;font-size:14px}
.ct th{font-family:var(--px);font-size:8px;letter-spacing:.08em;color:var(--l2);text-align:left;
  padding:0 8px 7px;border-bottom:1px solid var(--l3);white-space:nowrap;font-weight:400}
.ct td{padding:9px 8px;border-bottom:1px solid var(--l4);vertical-align:middle}
.ct tr.h{cursor:pointer}
.ct tr.h:hover td{background:var(--l4)}
.tier{font-family:var(--px);font-size:9px;padding:2px 5px;border:1px solid var(--l3);color:var(--l2)}
.tier[data-t=S]{background:var(--p);color:var(--ink);border-color:var(--p)}
.uni{color:var(--p);font-size:15px}
.pg{color:var(--l2);font-size:12.5px}
.dl{font-family:var(--px);font-size:9px;color:var(--l2);white-space:nowrap}
.dl[data-soon]{background:var(--p);color:var(--ink);padding:2px 4px}
.stx{font-family:var(--px);font-size:8px;letter-spacing:.06em;color:var(--l2);white-space:nowrap}
.stx[data-on]{background:var(--p);color:var(--ink);padding:3px 5px}
.det{display:none}
.det[data-open]{display:table-row}
.det td{padding:14px 8px 20px;border-bottom:1px solid var(--l3)}
.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:0 20px;margin-bottom:14px}
.f{border-top:1px solid var(--l4);padding:6px 0}
.f b{display:block;font-family:var(--px);font-size:8px;letter-spacing:.08em;color:var(--l3);font-weight:400;margin-bottom:3px}
.f span{font-size:14px;color:var(--l2)}
.f span.hi{color:var(--p)}
.ctl{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.ctl label{font-family:var(--px);font-size:8px;letter-spacing:.06em;color:var(--l3);display:block;margin-bottom:4px}

.le{display:flex;gap:16px;padding:7px 0;border-bottom:1px solid var(--l4);font-size:14px}
.le time{font-family:var(--px);font-size:8px;color:var(--l3);min-width:96px;padding-top:3px;white-space:nowrap}
.le span{color:var(--l2)}
.nil{color:var(--l3);padding:14px 0;font-size:14px}
.ft{font-family:var(--px);font-size:8px;letter-spacing:.12em;color:var(--l3);text-align:center;padding:34px 0 0}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--l3)}
@media(max-width:640px){
  .mhead,.mrow{grid-template-columns:86px 1fr;gap:9px}
  :root{--nc:95px}
  .mrow .nm{font-size:10.5px}
  .sb{padding-left:10px}
  .rm{opacity:1}
  .hide{display:none}
  input[type=date]{width:96px;font-size:12px}
  .cnt{gap:16px}
  [role=tablist]{gap:18px}
}
</style>
</head>

/* ── storage: local always, secret gist for cross-device ── */
const CFG=KEY+"_cfg", GF="deadreckoning.json";
const cfg=()=>{try{return JSON.parse(localStorage.getItem(CFG))||{}}catch(e){return{}}};
const setCfg=c=>{try{localStorage.setItem(CFG,JSON.stringify(c))}catch(e){}};
const setSync=s=>{if(E.sS)E.sS.textContent=s};
const hhmm=()=>new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
const hydrate=d=>Object.assign({tab:"work",log:[],open:{},co:{},copen:{},rev:0},d);

let S=SEED();
try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.tracks)S=hydrate(r)}catch(e){}

const gh=(p,o)=>fetch("https://api.github.com"+p,Object.assign({headers:{
  Authorization:"Bearer "+cfg().token,Accept:"application/vnd.github+json"}},o||{}));

let pushT=null;
const save=()=>{
  S.rev=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(cfg().token&&cfg().gist){clearTimeout(pushT);pushT=setTimeout(pushCloud,1200)}
};

async function pushCloud(){
  const c=cfg(); if(!c.token||!c.gist)return;
  setSync("SAVING");
  try{
    const r=await gh("/gists/"+c.gist,{method:"PATCH",
      body:JSON.stringify({files:{[GF]:{content:JSON.stringify(S)}}})});
    if(!r.ok)throw 0;
    setSync(hhmm());
  }catch(e){setSync("PUSH FAILED")}
}

async function makeGist(){
  setSync("CREATING");
  try{
    const r=await gh("/gists",{method:"POST",body:JSON.stringify({
      description:"DEAD RECKONING tracker state",public:false,
      files:{[GF]:{content:JSON.stringify(S)}}})});
    if(!r.ok)throw 0;
    const j=await r.json();
    setCfg(Object.assign(cfg(),{gist:j.id}));
    setSync(hhmm());
    alert("GIST CREATED\n\nID: "+j.id+"\n\nEnter this ID under SYNC SETUP on your other devices.");
  }catch(e){setSync("CREATE FAILED");alert("Could not create the gist. Check the token has Gists read+write.")}
}

async function pullCloud(){
  const c=cfg();
  if(!c.token){setSync("LOCAL ONLY");return false}
  if(!c.gist){await makeGist();return false}
  setSync("LOADING");
  try{
    const r=await gh("/gists/"+c.gist);
    if(!r.ok)throw 0;
    const j=await r.json(), f=j.files&&j.files[GF];
    if(!f)throw 0;
    const txt=f.truncated?await(await fetch(f.raw_url)).text():f.content;
    const d=JSON.parse(txt);
    if(d&&d.tracks&&(d.rev||0)>(S.rev||0)){
      S=hydrate(d);
      try{localStorage.setItem(KEY,txt)}catch(e){}
      setSync("PULLED "+hhmm());
      return true;
    }
    if((S.rev||0)>(d.rev||0)){await pushCloud()} else {setSync(hhmm())}
    return false;
  }catch(e){setSync("PULL FAILED");return false}
}

const refresh=()=>pullCloud().then(ch=>{if(ch){render();tab(S.tab||"work")}});
const note=t=>{S.log.unshift({ts:Date.now(),t});if(S.log.length>500)S.log.length=500};

const D=s=>new Date(s+"T00:00:00");
const nowd=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const dif=(a,b)=>Math.round((b-a)/864e5);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const TOT=dif(D(START),D(END))+1;
const trk=i=>S.tracks.find(t=>t.id===i);
const cof=i=>(S.co[i]=S.co[i]||{status:"NOT STARTED",prio:"-",notes:""});
const STAT=["NOT STARTED","RESEARCHING","DRAFTING","SUBMITTED","INTERVIEW","OFFER","REJECTED","DECLINED"];
const PRIO=["-","HIGH","MEDIUM","LOW","DROP"];
function stat(){let a=0,d=0,late=0;const T=nowd();
  S.tracks.forEach(t=>t.tasks.forEach(x=>{a++;if(x.done)d++;else if(x.due&&dif(T,D(x.due))<0)late++}));
  return{a,d,late,p:a?Math.round(d/a*100):0}}

function clock(){
  const n=new Date();
  E.fDate.textContent=n.toLocaleDateString("en-GB",
    {weekday:"short",day:"2-digit",month:"short",year:"numeric"}).toUpperCase().replace(/,/g,"");
  E.fTime.textContent=n.toLocaleTimeString("en-GB",{hour12:false});
}

function head(){
  const T=nowd(),st=stat(),g=Math.min(TOT,Math.max(0,dif(D(START),T)));
  E.cD.textContent=E.sD.textContent=Math.max(0,dif(T,D(END)));
  E.cP.textContent=st.p+"%";E.cO.textContent=st.a-st.d;
  E.sT.textContent=st.d+"/"+st.a;E.sO.textContent=st.late;
  E.sW.textContent=(g<0||g>=TOT)?"-":Math.floor(g/7)+1;
  E.sA.textContent=COLLEGES.filter(c=>(S.co[c.id]||{}).status==="SUBMITTED").length+"/"+COLLEGES.length;
  const pc=g/(TOT-1)*100;
  let h='<div class="fill" style="width:'+pc+'%"></div>';
  for(let i=1;i<7;i++)h+='<div class="tick" style="left:'+(i*100/7)+'%"></div>';
  h+='<div class="cur" style="left:'+pc+'%"></div>';
  E.pbar.innerHTML=h;
  E.sMid.textContent=(g<0||g>=TOT)?"":"DAY "+(g+1)+" / "+TOT;
}

/* contiguous date runs -> one unbroken box, with its own done-fraction */
function runs(t){
  const ds=t.tasks.filter(x=>x.due).map(x=>x.due).sort();
  if(!ds.length)return[];
  const seg=[];let a=D(ds[0]),p=a;
  for(let i=1;i<ds.length;i++){const c=D(ds[i]);if(dif(p,c)>8){seg.push([a,p]);a=c}p=c}
  seg.push([a,p]);
  return seg.map(x=>{
    const s=Math.max(0,dif(D(START),x[0])),e=Math.min(TOT-1,dif(D(START),x[1]));
    const inr=t.tasks.filter(k=>k.due&&D(k.due)>=x[0]&&D(k.due)<=x[1]);
    const dn=inr.filter(k=>k.done).length;
    return{l:s/TOT*100,w:Math.max(1.8,(e-s+1)/TOT*100),dn:dn,n:inr.length,
           pc:inr.length?Math.round(dn/inr.length*100):0};
  });
}
function mapv(){
  const T=nowd(),td=dif(D(START),T),cw=Math.floor(td/7);
  let h='<div class="mhead"><div></div><div class="wks">';
  ["AUG 1","AUG 8","AUG 15","AUG 22","AUG 29","SEP 5","SEP 12"]
    .forEach((w,i)=>h+='<span class="'+(i===cw?"on":"")+'">'+w+"</span>");
  h+='</div></div><div class="rows"><div class="ov">';
  for(let i=1;i<7;i++)h+='<div class="wk" style="--x:'+(i/7)+'"></div>';
  h+="</div>";
  S.tracks.forEach(t=>{
    const dn=t.tasks.filter(x=>x.done).length,n=t.tasks.length;
    h+='<div class="mrow"><div class="nm'+(n&&dn===n?" all":"")+'" title="'+esc(t.name)+'">'+
       '<span>'+esc(t.name)+'</span><i>'+dn+"/"+n+'</i></div><div class="lane">';
    runs(t).forEach(r=>{
      h+='<div class="bar'+(t.kind==="steady"?" s":"")+'" style="left:'+r.l+'%;width:'+r.w+'%" '+
         'title="'+r.dn+" of "+r.n+' done"><b style="width:'+r.pc+'%"></b></div>';
    });
    h+="</div></div>";
  });
  if(td>=0&&td<TOT)h+='<div class="nowl" style="--x:'+(td/TOT)+'"></div>';
  h+="</div>";
  E.map.innerHTML=h;
}

function strands(){
  const T=nowd();
  E.strands.innerHTML=S.tracks.map(t=>{
    const dn=t.tasks.filter(x=>x.done).length,n=t.tasks.length,pc=n?Math.round(dn/n*100):0,op=S.open[t.id];
    const rows=t.tasks.map(x=>{
      const g=x.due?dif(T,D(x.due)):99;
      return '<div class="task"'+(x.done?" data-done":"")+(!x.done&&g<0?" data-late":"")+
        ' data-t="'+t.id+'" data-x="'+x.id+'">'+
        '<button class="cb" data-a="tog" aria-pressed="'+!!x.done+'" aria-label="Toggle">'+(x.done?"X":"")+'</button>'+
        '<div class="tx" contenteditable="plaintext-only" data-a="text">'+esc(x.text)+'</div>'+
        '<input type="date" value="'+(x.due||"")+'" data-a="date" min="2026-06-01" max="2027-12-31">'+
        '<button class="rm" data-a="del" aria-label="Delete">&times;</button></div>';
    }).join("");
    return '<div class="st" data-t="'+t.id+'">'+
      '<button class="sbtn" data-a="fold" aria-expanded="'+!!op+'"'+(n&&dn===n?" data-all":"")+'>'+
      '<span class="k">'+(op?"&#9660;":"&#9654;")+'</span><span class="t">'+esc(t.name)+'</span>'+
      '<span class="n">'+dn+"/"+n+'</span><span class="mini"><b style="width:'+pc+'%"></b></span></button>'+
      '<div class="sb"'+(op?" data-open":"")+'>'+rows+
      '<div class="add"><input type="text" data-a="ntext" placeholder="NEW TASK">'+
      '<input type="date" data-a="ndate" value="'+iso(T)+'" min="2026-06-01" max="2027-12-31">'+
      '<button class="btn" data-a="add">+ ADD</button></div>'+
      '<textarea data-a="note" placeholder="NOTES - WHERE THIS STANDS, WHAT BLOCKS IT">'+esc(t.notes)+'</textarea>'+
      '<div class="ops"><button class="lk" data-a="ren">RENAME</button>'+
      '<button class="lk" data-a="kind">MARK '+(t.kind==="steady"?"INTENSIVE":"CONTINUOUS")+'</button>'+
      '<button class="lk" data-a="delt">DELETE STRAND</button></div></div></div>';
  }).join("");
  const st=stat();
  E.stNote.textContent=st.late?st.late+" OVERDUE":"NONE OVERDUE";
}

function dlab(c){
  if(!c.iso)return{txt:c.closes.toUpperCase(),soon:false};
  const g=dif(nowd(),D(c.iso));
  return{txt:(c.approx?"~":"")+D(c.iso).toLocaleDateString("en-GB",{day:"2-digit",month:"short"}).toUpperCase()+" +"+g+"D",soon:g<=60};
}
function college(){
  const rows=COLLEGES.slice().sort((a,b)=>(a.tier===b.tier?0:a.tier==="S"?-1:1));
  E.coBody.innerHTML=rows.map(c=>{
    const u=cof(c.id),d=dlab(c),op=S.copen[c.id];
    const F=(l,v,hi)=>v?'<div class="f"><b>'+l+'</b><span class="'+(hi?"hi":"")+'">'+esc(v)+"</span></div>":"";
    return '<tr class="h" data-c="'+c.id+'" data-a="exp"><td><span class="tier" data-t="'+c.tier+'">'+c.tier+'</span></td>'+
      '<td><div class="uni">'+esc(c.uni)+'</div><div class="pg">'+esc(c.prog)+'</div></td>'+
      '<td class="hide"><span class="pg">'+esc(c.country)+'</span></td>'+
      '<td><span class="dl"'+(d.soon?" data-soon":"")+'>'+esc(d.txt)+'</span></td>'+
      '<td class="hide"><span class="pg">'+esc(c.port)+'</span></td>'+
      '<td><span class="stx"'+(u.status!=="NOT STARTED"?" data-on":"")+'>'+u.status+'</span></td></tr>'+
      '<tr class="det"'+(op?" data-open":"")+' data-d="'+c.id+'"><td colspan="6"><div class="dg">'+
      F("DEPARTMENT",c.dept)+F("DURATION",c.dur)+F("TUITION (INTL)",c.tui)+F("LIVING COST",c.live)+
      F("TOTAL EST.",c.tot,1)+F("APP FEE",c.fee)+F("OPENS",c.opens)+F("CLOSES",c.closes,1)+
      F("PORTFOLIO",c.port,1)+F("IELTS",c.ielts)+F("TOEFL",c.toefl,1)+F("GRE",c.gre)+
      F("WORK EXP",c.work)+F("SCHOLARSHIPS",c.schol)+F("DOCUMENTS",c.docs)+F("INTERNSHIPS",c.intern)+
      F("RESEARCH",c.res)+F("POST-STUDY VISA",c.visa)+'</div>'+
      (c.link?'<div style="margin-bottom:12px"><a href="'+esc(c.link)+'" target="_blank" rel="noopener">'+esc(c.link)+"</a></div>":"")+
      '<div class="ctl"><div><label>STATUS</label><select data-a="cs" data-c="'+c.id+'">'+
      STAT.map(s=>'<option'+(s===u.status?" selected":"")+">"+s+"</option>").join("")+'</select></div>'+
      '<div><label>PRIORITY</label><select data-a="cp" data-c="'+c.id+'">'+
      PRIO.map(s=>'<option'+(s===u.prio?" selected":"")+">"+s+"</option>").join("")+'</select></div></div>'+
      '<textarea data-a="cn" data-c="'+c.id+'" placeholder="NOTES ON THIS PROGRAMME">'+esc(u.notes)+'</textarea></td></tr>';
  }).join("");
  E.coNote.textContent=COLLEGES.filter(c=>cof(c.id).status==="SUBMITTED").length+" SUBMITTED / "+COLLEGES.length+" TRACKED";
  const num=a=>a.map(v=>parseFloat(String(v).replace(/[^\d.]/g,""))).filter(v=>v>0);
  const pr=COLLEGES.filter(c=>/^required/i.test(c.port));
  const lor=COLLEGES.filter(c=>/3 LOR/i.test(c.docs)).length;
  E.reqs.innerHTML='<div class="dg">'+
    '<div class="f"><b>HIGHEST TOEFL DEMANDED</b><span class="hi">'+Math.max.apply(null,num(COLLEGES.map(c=>c.toefl)))+' / MIT</span></div>'+
    '<div class="f"><b>HIGHEST IELTS DEMANDED</b><span class="hi">'+Math.max.apply(null,num(COLLEGES.map(c=>c.ielts))).toFixed(1)+'</span></div>'+
    '<div class="f"><b>GRE</b><span>NOT REQUIRED ANYWHERE ON THIS LIST</span></div>'+
    '<div class="f"><b>PORTFOLIO REQUIRED</b><span class="hi">'+pr.length+" OF "+COLLEGES.length+" - "+esc(pr.map(c=>c.uni).join(", "))+'</span></div>'+
    '<div class="f"><b>PROGRAMMES NEEDING 3 LORs</b><span>'+lor+'</span></div>'+
    '<div class="f"><b>EARLIEST CLOSE</b><span class="hi">~02 DEC 26 / STANFORD</span></div></div>';
}

function logv(){
  E.lgNote.textContent=S.log.length?S.log.length+" ENTRIES":"";
  E.log.innerHTML=S.log.length?S.log.slice(0,70).map(e=>{
    const d=new Date(e.ts);
    return '<div class="le"><time>'+d.toLocaleDateString("en-GB",{day:"2-digit",month:"short"}).toUpperCase()+
      " "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})+"</time><span>"+esc(e.t)+"</span></div>";
  }).join(""):'<div class="nil">NO ENTRIES. EVERY CHANGE IS LOGGED HERE.</div>';
}

/* single render path - every mutation redraws the timeline too */
function render(){head();mapv();strands();college();logv()}

const TABS=[].slice.call(document.querySelectorAll("[role=tab]"));
function tab(name,foc){
  S.tab=name;save();
  TABS.forEach(t=>{
    const on=t.dataset.tab===name;
    on?t.setAttribute("data-selected",""):t.removeAttribute("data-selected");
    t.setAttribute("aria-selected",on);t.tabIndex=on?0:-1;
    $(t.getAttribute("aria-controls")).hidden=!on;
    if(on&&foc)t.focus();
  });
}
const TL=document.querySelector("[role=tablist]");
TL.addEventListener("click",e=>{const t=e.target.closest("[role=tab]");if(t)tab(t.dataset.tab)});
TL.addEventListener("keydown",e=>{
  const i=TABS.findIndex(t=>t.dataset.tab===S.tab);let n=-1;
  if(e.key==="ArrowRight")n=(i+1)%TABS.length;
  if(e.key==="ArrowLeft")n=(i-1+TABS.length)%TABS.length;
  if(e.key==="Home")n=0;
  if(e.key==="End")n=TABS.length-1;
  if(n>=0){e.preventDefault();tab(TABS[n].dataset.tab,true)}
});

E.strands.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,row=b.closest(".task"),tid=(row||b.closest(".st")).dataset.t,t=trk(tid);
  if(a==="fold"){S.open[tid]=!S.open[tid];save();strands();return}
  if(a==="tog"){const x=t.tasks.find(y=>y.id===row.dataset.x);x.done=!x.done;
    note((x.done?"DONE - ":"REOPENED - ")+x.text+" / "+t.name);save();render();return}
  if(a==="del"){const i=t.tasks.findIndex(y=>y.id===row.dataset.x),x=t.tasks[i];
    if(!confirm("DELETE: "+x.text))return;
    t.tasks.splice(i,1);note("DELETED - "+x.text+" / "+t.name);save();render();return}
  if(a==="add"){const w=b.closest(".add"),tx=w.querySelector("[data-a=ntext]"),dt=w.querySelector("[data-a=ndate]");
    const v=tx.value.trim();if(!v){tx.focus();return}
    t.tasks.push({id:nid(),text:v,due:dt.value||iso(nowd()),done:false});
    t.tasks.sort((p,q)=>(p.due||"").localeCompare(q.due||""));
    note("ADDED - "+v+" / "+t.name);save();render();
    const f=E.strands.querySelector('.st[data-t="'+tid+'"] [data-a=ntext]');if(f)f.focus();return}
  if(a==="ren"){const v=prompt("RENAME STRAND",t.name);if(v===null)return;
    const o=t.name;t.name=v.trim()||o;if(o!==t.name)note("RENAMED - "+o+" > "+t.name);save();render();return}
  if(a==="kind"){t.kind=t.kind==="steady"?"deep":"steady";
    note(t.name+" > "+(t.kind==="steady"?"CONTINUOUS":"INTENSIVE"));save();render();return}
  if(a==="delt"){if(!confirm("DELETE STRAND: "+t.name))return;
    S.tracks=S.tracks.filter(y=>y.id!==tid);note("DELETED STRAND - "+t.name);save();render();return}
});
E.strands.addEventListener("change",e=>{
  if(e.target.dataset.a!=="date")return;
  const row=e.target.closest(".task"),t=trk(row.dataset.t),x=t.tasks.find(y=>y.id===row.dataset.x),o=x.due;
  x.due=e.target.value;t.tasks.sort((p,q)=>(p.due||"").localeCompare(q.due||""));
  note("MOVED - "+x.text+" / "+(o||"NONE")+" > "+(x.due||"NONE"));save();render();
});
E.strands.addEventListener("blur",e=>{
  const el=e.target;
  if(el.dataset.a==="text"){
    const row=el.closest(".task"),t=trk(row.dataset.t),x=t.tasks.find(y=>y.id===row.dataset.x);
    const v=el.textContent.trim();
    if(!v||v===x.text){el.textContent=x.text;return}
    note("EDITED - "+x.text+" > "+v);x.text=v;save();render();
  }
  if(el.dataset.a==="note"){const t=trk(el.closest(".st").dataset.t);
    if(t.notes===el.value)return;t.notes=el.value;note("NOTE - "+t.name);save();logv()}
},true);
E.strands.addEventListener("keydown",e=>{
  const a=e.target.dataset.a;
  if(a==="text"&&(e.key==="Enter"||e.key==="Escape")){e.preventDefault();e.target.blur()}
  if(a==="ntext"&&e.key==="Enter"){e.preventDefault();e.target.closest(".add").querySelector("[data-a=add]").click()}
});
E.addTrack.onclick=()=>{const v=E.newTrack.value.trim();if(!v){E.newTrack.focus();return}
  S.tracks.push({id:nid(),name:v,kind:"deep",notes:"",tasks:[]});
  E.newTrack.value="";note("NEW STRAND - "+v);save();render()};
E.newTrack.addEventListener("keydown",e=>{if(e.key==="Enter")E.addTrack.click()});

E.coBody.addEventListener("click",e=>{
  if(e.target.closest("select,textarea,a"))return;
  const r=e.target.closest("[data-a=exp]");if(!r)return;
  const id=r.dataset.c;S.copen[id]=!S.copen[id];save();
  const d=E.coBody.querySelector('[data-d="'+id+'"]');
  S.copen[id]?d.setAttribute("data-open",""):d.removeAttribute("data-open");
});
E.coBody.addEventListener("change",e=>{
  const el=e.target,a=el.dataset.a;if(a!=="cs"&&a!=="cp")return;
  const c=COLLEGES.find(x=>x.id===el.dataset.c),u=cof(c.id);
  if(a==="cs"){u.status=el.value;note("APP - "+c.uni+" > "+el.value)}
  else{u.prio=el.value;note("PRIORITY - "+c.uni+" > "+el.value)}
  save();head();college();logv();
});
E.coBody.addEventListener("blur",e=>{
  if(e.target.dataset.a!=="cn")return;
  const c=COLLEGES.find(x=>x.id===e.target.dataset.c),u=cof(c.id);
  if(u.notes===e.target.value)return;
  u.notes=e.target.value;note("NOTE - "+c.uni);save();logv();
},true);

const dlf=(t,n,m)=>{const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()};
E.eJ.onclick=()=>dlf(JSON.stringify(S,null,2),"deadreckoning-"+iso(nowd())+".json","application/json");
E.eM.onclick=()=>{const st=stat();
  let m="# DEAD RECKONING\n\n"+st.d+"/"+st.a+" complete ("+st.p+"%)\n\n";
  S.tracks.forEach(t=>{m+="## "+t.name+"\n\n";
    t.tasks.forEach(x=>m+="- ["+(x.done?"x":" ")+"] "+x.text+" - "+(x.due||"undated")+"\n");
    if(t.notes)m+="\n> "+t.notes+"\n";m+="\n"});
  m+="## APPLICATIONS\n\n| Tier | University | Closes | Status | Priority |\n|---|---|---|---|---|\n";
  COLLEGES.forEach(c=>{const u=cof(c.id);
    m+="| "+c.tier+" | "+c.uni+" | "+c.closes+" | "+u.status+" | "+u.prio+" |\n"});
  dlf(m,"deadreckoning.md","text/markdown")};
E.iJ.onclick=()=>E.fi.click();
E.fi.onchange=()=>{const f=E.fi.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.tracks)throw 0;
    S=hydrate(d);
    note("IMPORTED SAVE FILE");save();render();tab(S.tab)}
  catch(err){alert("FILE NOT READABLE AS TRACKER DATA")}};
  r.readAsText(f);E.fi.value=""};
E.rs.onclick=()=>{if(!confirm("RESET EVERYTHING? ALL EDITS LOST."))return;
  S=SEED();note("RESET TO SEED");save();render();tab("work")};

if(E.sy)E.sy.onclick=async()=>{
  const c=cfg();
  const t=prompt("GITHUB TOKEN — fine-grained, Gists: read+write.\nStored on this device only.",c.token||"");
  if(t===null)return;
  const g=prompt("GIST ID — leave blank on the first device and one will be made for you.",c.gist||"");
  if(g===null)return;
  setCfg({token:t.trim(),gist:g.trim()});
  if(!g.trim()){await makeGist()}else{await refresh()}
};
if(E.sn)E.sn.onclick=()=>refresh();

clock();render();tab(S.tab||"work");
refresh();
window.addEventListener("focus",refresh);
setInterval(clock,1000);
setInterval(head,300000);
</script>
